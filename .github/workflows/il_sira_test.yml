name: Il Sirasi Takip

on:
  schedule:
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: il-sira-takip
  cancel-in-progress: false

jobs:
  kontrol:
    runs-on: ubuntu-latest

    steps:
      - name: Dosyalari indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kutuphaneleri yukle
        run: pip install requests beautifulsoup4

      - name: Il siralarini kontrol et
        run: python il_sira_takip.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Siralari GitHub'a kaydet
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add il_siralari.json
          if ! git diff --cached --quiet; then
            git commit -m "Il siralari guncellendi"
            git push
          fi
          
